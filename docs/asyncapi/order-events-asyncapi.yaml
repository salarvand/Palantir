asyncapi: '3.0.0'
info:
  title: Palantir Order Lifecycle & Audit Events
  version: '1.0.0'
  description: Order lifecycle domain and audit events broadcast via RabbitMQ for compliance persistence in PostgreSQL.
servers:
  rabbitmq:
    host: localhost:5672
    protocol: amqp
channels:
  auditTrail:
    address: audit.trail.v1
    messages:
      auditTrailEvent:
        $ref: '#/components/messages/AuditTrailEvent'
components:
  messages:
    AuditTrailEvent:
      name: AuditTrailEvent
      contentType: application/json
      payload:
        type: object
        required:
          - eventType
          - orderId
          - clientId
          - symbol
          - price
          - quantity
          - timestampUtc
        properties:
          eventType:
            type: string
          orderId:
            type: string
            format: uuid
          tradeId:
            type: string
            format: uuid
          clientId:
            type: string
            format: uuid
          symbol:
            type: string
          price:
            type: number
          quantity:
            type: number
          payloadJson:
            type: string
          timestampUtc:
            type: string
            format: date-time
