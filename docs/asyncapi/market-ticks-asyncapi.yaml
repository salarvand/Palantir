asyncapi: '3.0.0'
info:
  title: Palantir Market Ticks Stream
  version: '1.0.0'
  description: RabbitMQ market tick stream emitted by Palantir.LocalEngineService upon trade execution and persisted to PostgreSQL.
servers:
  rabbitmq:
    host: localhost:5672
    protocol: amqp
    description: Local Aspire RabbitMQ Broker
channels:
  marketTicks:
    address: market.ticks.v1
    messages:
      marketTickMessage:
        $ref: '#/components/messages/MarketTickRecordedEvent'
components:
  messages:
    MarketTickRecordedEvent:
      name: MarketTickRecordedEvent
      title: Market Tick Event
      summary: Individual trade match tick with timestamp, price, and volume
      contentType: application/json
      payload:
        type: object
        required:
          - tradeId
          - symbol
          - price
          - quantity
          - side
          - timestampUtc
        properties:
          tradeId:
            type: string
            format: uuid
          symbol:
            type: string
            description: Trading pair ticker symbol (e.g. PAL/USD)
          price:
            type: number
            description: Matched trade execution price
          quantity:
            type: number
            description: Matched execution quantity
          side:
            type: string
          timestampUtc:
            type: string
            format: date-time
            description: UTC execution timestamp
