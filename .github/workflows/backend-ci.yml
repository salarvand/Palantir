name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Palantir.slnx

      - name: Build Solution
        run: dotnet build Palantir.slnx --no-restore --configuration Release

      - name: Run Architecture Governance Tests
        run: dotnet test tests/Palantir.ArchTests/Palantir.ArchTests.csproj --no-build --configuration Release

      - name: Run All Unit Tests
        run: dotnet test Palantir.slnx --no-build --configuration Release --filter "FullyQualifiedName~UnitTests"

      - name: Run Aspire Integration Tests
        run: dotnet test tests/Palantir.IntegrationTests/Palantir.IntegrationTests.csproj --no-build --configuration Release

      - name: Run Reqnroll BDD Tests
        run: dotnet test tests/Palantir.BddTests/Palantir.BddTests.csproj --no-build --configuration Release
